name: Build Motion Studio for Windows
on:
  workflow_dispatch:
  push:
    branches: [main]
permissions:
  contents: read
jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt pyinstaller
      - name: Build executable
        run: pyinstaller --noconfirm --clean --windowed --name MotionStudio --collect-all imageio_ffmpeg --collect-all imageio main.py
      - name: Upload Windows executable
        uses: actions/upload-artifact@v4
        with:
          name: MotionStudio-Windows
          path: dist/MotionStudio/
          if-no-files-found: error
